name: Release

# Trigger only when a tag is pushed
on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up mise (installs go/helm/kustomize from .mise.toml)
      uses: jdx/mise-action@v3

    - name: Cache Go modules + build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Test
      run: mise run test

    - name: Build
      run: mise run build
      env:
        TARGETS: release
        GENERATE_PACKAGES: true

    - name: Release
      uses: softprops/action-gh-release@35d938cf01f60fbe522917c81be1e892074f6ad6
      with:
        files: |
          pkg/binnacle-*.tar.gz
          pkg/SHA256SUM.txt
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
