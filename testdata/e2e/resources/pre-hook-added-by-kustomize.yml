apiVersion: v1
kind: ConfigMap
metadata:
  name: e2e-pre-hook-from-kustomize
  annotations:
    # A hook that runs before the upgrade. scripts/e2e.sh checks what happens to
    # this resource when a release moves from Helm 3 to Helm 4.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
data:
  added-by: kustomize
