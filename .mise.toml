# binnacle build toolchain — mise (replaces the old asdf .tool-versions).
# go builds the binary; helm/kustomize are what binnacle shells out to at
# runtime (not needed for `go test`, but pinned here for local end-to-end runs
# and kept in sync with infra-platform's stack). jq is neither a compiler nor
# a runtime shell-out: scripts/build.sh depends on it to read the version out
# of .release-please-manifest.json.
[tools]
go = "1.26.2"
helm = "4.2.4"
kustomize = "5.8.1"
jq = "1.7.1"

[tasks.build]
description = "Cross-compile binnacle (scripts/build.sh)"
run = "scripts/build.sh"

[tasks.test]
description = "Run unit tests"
run = "go test -v ./..."

[tasks.coverage]
description = "Run unit tests with a coverage profile (coverage.out)"
# Same invocation CI uses, so a local number always matches the gate. atomic
# mode keeps the profile valid if -race is ever added.
run = "go test -covermode=atomic -coverprofile=coverage.out ./..."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin pkg"
